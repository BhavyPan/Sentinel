# Instructions:
#   - Fill in ALL required fields (marked with # REQUIRED)
#   - Optional fields can be left as empty strings ""
#   - Do NOT rename this file — the evaluation pipeline reads it by name
#   - Use double quotes around all string values
# =============================================================================

team:
  name: "Sentinel"                             # REQUIRED — e.g., "Orion Squad"
  track: "AI"                                  # REQUIRED — one of: AI | DevOps | Sustainability | Open
  lead:
    name: "BhavyPan"                           # REQUIRED — e.g., "Alice Chen"
    email: "bhavypan@example.com"              # REQUIRED — e.g., "alice.chen@ibm.com"
  members:
    - name: "BhavyPan"                         # REQUIRED — Team member 1
      email: "bhavypan@example.com"

submission:
  title: "Sentinel2"                           # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                         # REQUIRED — 1-3 sentences. What problem? Who has it?
    Security Operations Center (SOC) analysts are overwhelmed by the sheer volume of security alerts, many of which are false positives or low-priority events. Sentinel2 addresses this by providing an AI-driven dashboard that correlates alerts into incidents, triages them, and provides actionable summaries, reducing alert fatigue.

  solution_summary: >                          # REQUIRED — 1-3 sentences. What did you build?
    We built a modern, responsive web application using Next.js and Tailwind CSS that ingests security alerts and groups them into incidents. It integrates an AI copilot using the Groq API to analyze incidents, summarize the "Bottom Line Up Front" (BLUF), and suggest immediate remediation steps.

  key_features:                                # REQUIRED — List 3 to 5 specific features you implemented
    - "Real-time Incident Dashboard"
    - "AI-Powered Analysis and BLUF summaries"
    - "Incident Correlation"
    - "Interactive Copilot chat assistant"
    - ""

  tech_stack:
    languages: ["TypeScript"]                  # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["Next.js", "React", "Tailwind CSS"] # e.g., ["FastAPI", "React"]
    ibm_technologies: []                       # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["Supabase", "PostgreSQL"]      # e.g., ["PostgreSQL", "Redis"]
    other: ["Groq API", "Vercel"]              # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >                 # Optional but recommended — guides judges to your best work
    Integrating lightning-fast AI capabilities via Groq directly into the incident response workflow, enabling analysts to go from raw alert data to an actionable summary in seconds.

  known_limitations: >                         # Optional but recommended — be honest about gaps
    Demo focuses primarily on the frontend UI and AI incident summarization. 

